# Hexo 站点主配置
# 文档: https://hexo.io/zh-cn/docs/configuration.html

title: 我的博客
subtitle: 记录技术与生活
description: 一个基于 Hexo + NexT 的静态博客
keywords: 技术, 博客
author: Agnon1573
language: zh-CN
timezone: Asia/Shanghai

url: https://agnon1573.github.io/Blog/
root: /Blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
category_dir: categories
archive_dir: archives
category: 分类
tag: 标签

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ' '
  wrap: true
  exclude_languages:
    - plaintext

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: 未分类
category_map:
tag_map:

metadata:
  author: Agnon1573

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

theme: next

# 本地搜索数据（hexo-generator-searchdb 插件，供 NexT 本地搜索使用）
search:
  path: search.xml
  field: post
  content: true
  format: html

theme_config:

# GitHub Pages 部署（hexo-deployer-git 插件）
# TODO: 把 yourname 改成你的 GitHub 用户名
deploy:
  type: git
  repo: git@ssh.github.com:Agnon1573/Blog.git
  branch: gh-pages
